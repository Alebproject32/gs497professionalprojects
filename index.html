<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      data-es="Acceso Seguro - Telepuerto Banda C"
      data-en="Secure Access - C-Band Teleport"
    >
      Acceso Seguro - Telepuerto Banda C
    </title>
    <link rel="stylesheet" href="./src/css/indexstyle.css" />
    <style>
      .login-box {
        display: none;
      }
      .login-box.active {
        display: block;
      }
      .tab-btn {
        background: #1e293b;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 5px 5px 0 0;
        font-weight: bold;
      }
      .tab-btn.active {
        background: var(--azul-interfaz, #3b82f6);
      }
    </style>
  </head>
  <body
    style="
      background-color: var(--bg-body, #0b1121);
      color: var(--texto-principal, #f8fafc);
      font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    "
  >
    <div
      style="
        max-width: 500px;
        width: 100%;
        padding: 30px;
        background: var(--bg-tarjeta, #131c31);
        border-radius: 12px;
        border: 1px solid var(--azul-interfaz, #3b82f6);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      "
    >
      <!-- Botón Conmutador de Idioma -->
      <div style="text-align: right; margin-bottom: 15px">
        <button
          id="lang-toggle"
          style="
            background: transparent;
            border: 1px solid var(--azul-interfaz);
            color: var(--azul-interfaz);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
          "
        >
          Switch to English
        </button>
      </div>

      <h2
        data-es="REDTV - Control de Acceso"
        data-en="REDTV - Access Control"
        style="
          color: var(--naranja-boton, #f07316);
          text-align: center;
          margin-bottom: 20px;
        "
      >
        REDTV - Control de Acceso
      </h2>

      <!-- Selector de Pestañas de Perfil -->
      <div
        style="
          display: flex;
          gap: 5px;
          margin-bottom: 20px;
          justify-content: center;
        "
      >
        <button
          class="tab-btn active"
          onclick="switchTab('tech')"
          data-es="🔧 Técnico de Campo"
          data-en="🔧 Field Technician"
        >
          🔧 Técnico de Campo
        </button>
        <button
          class="tab-btn"
          onclick="switchTab('admin')"
          data-es="🛡️ Administrador"
          data-en="🛡️ Administrator"
        >
          🛡️ Administrador
        </button>
      </div>

      <!-- FORMULARIO TÉCNICO -->
      <div id="tech-box" class="login-box active">
        <p
          data-es="Ingrese su nombre y cédula para registrar su sesión de diagnóstico:"
          data-en="Enter your name and ID to register your diagnostic session:"
          style="font-size: 0.9rem; color: #94a368; margin-bottom: 15px"
        >
          Ingrese su nombre y cédula para registrar su sesión de diagnóstico:
        </p>
        <form id="tech-form">
          <div style="margin-bottom: 15px">
            <label
              data-es="Nombre del Técnico:"
              data-en="Technician Name:"
              style="display: block; margin-bottom: 5px; font-size: 0.85rem"
              >Nombre del Técnico:</label
            >
            <input
              type="text"
              id="tech-name"
              required
              placeholder="Ej. Carlos Pérez"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                border: 1px solid #475569;
                background: #0f172a;
                color: white;
              "
            />
          </div>
          <div style="margin-bottom: 20px">
            <label
              data-es="Cédula de Identidad / ID:"
              data-en="ID Number:"
              style="display: block; margin-bottom: 5px; font-size: 0.85rem"
              >Cédula de Identidad / ID:</label
            >
            <input
              type="text"
              id="tech-id"
              required
              placeholder="Ej. V-15234567"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                border: 1px solid #475569;
                background: #0f172a;
                color: white;
              "
            />
          </div>
          <button
            type="submit"
            style="
              width: 100%;
              padding: 12px;
              background: var(--naranja-boton, #f07316);
              color: white;
              border: none;
              border-radius: 5px;
              font-weight: bold;
              cursor: pointer;
            "
            data-es="Iniciar Sesión como Técnico"
            data-en="Login as Technician"
          >
            Iniciar Sesión como Técnico
          </button>
        </form>
      </div>

      <!-- FORMULARIO ADMINISTRADOR -->
      <div id="admin-box" class="login-box">
        <p
          data-es="Acceso restringido para supervisores y administradores del telepuerto:"
          data-en="Restricted access for teleport supervisors and administrators:"
          style="font-size: 0.9rem; color: #94a368; margin-bottom: 15px"
        >
          Acceso restringido para supervisores y administradores del telepuerto:
        </p>
        <form id="admin-form">
          <div style="margin-bottom: 15px">
            <label
              data-es="Usuario Admin:"
              data-en="Admin Username:"
              style="display: block; margin-bottom: 5px; font-size: 0.85rem"
              >Usuario Admin:</label
            >
            <input
              type="text"
              id="admin-user"
              required
              placeholder="admin_redtv"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                border: 1px solid #475569;
                background: #0f172a;
                color: white;
              "
            />
          </div>
          <div style="margin-bottom: 20px">
            <label
              data-es="Contraseña:"
              data-en="Password:"
              style="display: block; margin-bottom: 5px; font-size: 0.85rem"
              >Contraseña:</label
            >
            <input
              type="password"
              id="admin-pass"
              required
              placeholder="••••••••"
              style="
                width: 100%;
                padding: 10px;
                border-radius: 5px;
                border: 1px solid #475569;
                background: #0f172a;
                color: white;
              "
            />
          </div>
          <div
            id="admin-error"
            style="
              color: #f87171;
              font-size: 0.85rem;
              margin-bottom: 10px;
              display: none;
            "
            data-es="Credenciales incorrectas."
            data-en="Invalid credentials."
          >
            Credenciales incorrectas.
          </div>
          <button
            type="submit"
            style="
              width: 100%;
              padding: 12px;
              background: var(--azul-interfaz, #3b82f6);
              color: white;
              border: none;
              border-radius: 5px;
              font-weight: bold;
              cursor: pointer;
            "
            data-es="Acceder al Panel Gerencial"
            data-en="Access Management Panel"
          >
            Acceder al Panel Gerencial
          </button>
        </form>
      </div>
    </div>

    <!-- Script de Autenticación e Idioma -->
    <script>
      function switchTab(role) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".login-box")
          .forEach((box) => box.classList.remove("active"));

        if (role === "tech") {
          event.currentTarget.classList.add("active");
          document.getElementById("tech-box").classList.add("active");
        } else {
          event.currentTarget.classList.add("active");
          document.getElementById("admin-box").classList.add("active");
        }
      }

      // Base de datos simulada de técnicos autorizados de REDTV (Cédula y Nombre)
      const authorizedTechnicians = [
        { id: "V-10200201", name: "Alejandro Pérez" },
        { id: "V-10200202", name: "Juan Gamargo" },
        { id: "V-10200203", name: "Luis Gomez" },
        { id: "V-10200204", name: "Dircson Arrae" },
        { id: "V-10200205", name: "Jean Zabaleta" },
        { id: "V-10200206", name: "Elvis Vasquez" },
        { id: "V-10200207", name: "Daniel Ojeda" },
        { id: "V-10200208", name: "Veruska Gonzalez" },
      ];

      // Registro y validación segura del Técnico
      document.getElementById("tech-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const inputName = document.getElementById("tech-name").value.trim();
        const inputId = document.getElementById("tech-id").value.trim();

        // Verificamos si la cédula ingresada se encuentra en la lista de autorizados
        const technicianFound = authorizedTechnicians.find(
          (tech) => tech.id.toLowerCase() === inputId.toLowerCase(),
        );

        if (technicianFound) {
          // Validación exitosa: Guardamos los datos verificados en el navegador
          localStorage.setItem("redtv_user_type", "technician");
          localStorage.setItem("redtv_user_name", technicianFound.name);
          localStorage.setItem("redtv_user_id", technicianFound.id);
          localStorage.setItem("redtv_login_time", new Date().toLocaleString());

          // Redirige a la página de diagnóstico de los técnicos
          window.location.href = "diagnostic.html";
        } else {
          // Si la cédula no está registrada, denegamos el acceso
          alert(
            "Acceso denegado: La Cédula ingresada no está registrada en el sistema de personal activo de REDTV.",
          );
        }
      });

      // Validación de sesión del Administrador
      document.getElementById("admin-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("admin-user").value;
        const pass = document.getElementById("admin-pass").value;

        // Credenciales de demostración seguras para el proyecto
        if (user === "admin" && pass === "redtv2026") {
          localStorage.setItem("redtv_user_type", "admin");
          localStorage.setItem("redtv_user_name", "Administrador General");
          localStorage.setItem("redtv_login_time", new Date().toLocaleString());
          window.location.href = "admin-dashboard.html";
        } else {
          document.getElementById("admin-error").style.display = "block";
        }
      });

      // Lógica bilingüe
      const langToggleBtn = document.getElementById("lang-toggle");
      langToggleBtn.addEventListener("click", () => {
        const currentLang = document.documentElement.lang;
        const newLang = currentLang === "es" ? "en" : "es";
        document.documentElement.lang = newLang;

        document.querySelectorAll("[data-es]").forEach((el) => {
          el.innerText = el.getAttribute(`data-${newLang}`);
        });
        langToggleBtn.innerText =
          newLang === "es" ? "Switch to English" : "Cambiar a Español";
      });
    </script>
  </body>
</html>
